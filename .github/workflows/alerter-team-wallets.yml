# Telegram alerter: team wallets (fully independent from the other alerter workflow).
#
# Free hosting via GitHub Actions cron. Enable it with repository settings:
#   Variables: TEAM_ALERTER_ENABLED = true
#   Secrets:   TEAM_BOT_TOKEN, TEAM_CHAT_ID, TEAM_CONFIG_YAML (contents of config/team_wallets.yaml),
#              ETH_RPC_URL, COINGECKO_API_KEY, ETHERSCAN_API_KEY, NODEREAL_API_KEY (all optional; NodeReal needed for BSC discovery)
# State (last scanned block, sent alerts) is carried between runs with actions/cache.
name: "Alerter: team wallets"

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: alerter-team-wallets
  cancel-in-progress: false

jobs:
  run:
    if: vars.TEAM_ALERTER_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: telegram-alerters
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: telegram-alerters/requirements.txt

      - run: pip install -r requirements.txt

      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: telegram-alerters/state
          key: team-wallets-state-${{ github.run_id }}
          restore-keys: team-wallets-state-

      - name: Write config from secret
        env:
          CONFIG_YAML: ${{ secrets.TEAM_CONFIG_YAML }}
        run: |
          if [ -n "$CONFIG_YAML" ]; then printf '%s\n' "$CONFIG_YAML" > config/team_wallets.yaml; fi
          test -f config/team_wallets.yaml || { echo "config/team_wallets.yaml missing: set secret TEAM_CONFIG_YAML"; exit 1; }

      - name: Run alerter
        env:
          TEAM_BOT_TOKEN: ${{ secrets.TEAM_BOT_TOKEN }}
          TEAM_CHAT_ID: ${{ secrets.TEAM_CHAT_ID }}
          ETH_RPC_URL: ${{ secrets.ETH_RPC_URL }}
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          TRONGRID_API_KEY: ${{ secrets.TRONGRID_API_KEY }}
          SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL }}
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
          NODEREAL_API_KEY: ${{ secrets.NODEREAL_API_KEY }}
        run: python -m alerters.team_wallets_bot -c config/team_wallets.yaml --once --max-runtime 240

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: telegram-alerters/state
          key: team-wallets-state-${{ github.run_id }}
