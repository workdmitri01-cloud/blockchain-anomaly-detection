# Telegram alerter: exchange flows (fully independent from the other alerter workflow).
#
# Free hosting via GitHub Actions cron. Enable it with repository settings:
#   Variables: EXCHANGE_ALERTER_ENABLED = true
#   Secrets:   EXCHANGE_BOT_TOKEN, EXCHANGE_CHAT_ID, EXCHANGE_CONFIG_YAML (contents of config/exchange_flows.yaml),
#              ETH_RPC_URL (optional), COINGECKO_API_KEY (optional)
# State (last scanned block, sent alerts) is carried between runs with actions/cache.
name: "Alerter: exchange flows"

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: alerter-exchange-flows
  cancel-in-progress: false

jobs:
  run:
    if: vars.EXCHANGE_ALERTER_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: telegram-alerters
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: telegram-alerters/requirements.txt

      - run: pip install -r requirements.txt

      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: telegram-alerters/state
          key: exchange-flows-state-${{ github.run_id }}
          restore-keys: exchange-flows-state-

      - name: Write config from secret
        env:
          CONFIG_YAML: ${{ secrets.EXCHANGE_CONFIG_YAML }}
        run: |
          if [ -n "$CONFIG_YAML" ]; then printf '%s\n' "$CONFIG_YAML" > config/exchange_flows.yaml; fi
          test -f config/exchange_flows.yaml || { echo "config/exchange_flows.yaml missing: set secret EXCHANGE_CONFIG_YAML"; exit 1; }

      - name: Run alerter
        env:
          EXCHANGE_BOT_TOKEN: ${{ secrets.EXCHANGE_BOT_TOKEN }}
          EXCHANGE_CHAT_ID: ${{ secrets.EXCHANGE_CHAT_ID }}
          ETH_RPC_URL: ${{ secrets.ETH_RPC_URL }}
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          TRONGRID_API_KEY: ${{ secrets.TRONGRID_API_KEY }}
          SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL }}
        run: python -m alerters.exchange_flows_bot -c config/exchange_flows.yaml --once --max-runtime 240

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: telegram-alerters/state
          key: exchange-flows-state-${{ github.run_id }}
