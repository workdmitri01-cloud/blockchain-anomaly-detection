# Default EVM chain definitions shared by both bots.
#
# rpc_urls are FREE public endpoints without API keys. They are tried in order
# and rotated on errors. Put your own keyed endpoints (Alchemy / Infura /
# QuickNode / Ankr / own node) into the bot config `chains.<name>.rpc_urls` —
# they are prepended to this list and used first.
#
# defillama  - chain slug for https://coins.llama.fi (free prices, no key)
# coingecko  - platform id for the CoinGecko fallback price API
# log_chunk  - starting block range for eth_getLogs (auto-halved on "range too large")

ethereum:
  chain_id: 1
  explorer: https://etherscan.io
  defillama: ethereum
  coingecko: ethereum
  confirmations: 2
  log_chunk: 1000
  initial_lookback: 25
  rpc_urls:
    - https://ethereum-rpc.publicnode.com
    - https://eth.llamarpc.com
    - https://eth.drpc.org
    - https://rpc.mevblocker.io

