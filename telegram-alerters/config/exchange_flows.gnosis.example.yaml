# ======================================================================
#  Бот №2 — заводы / выводы на биржи (CEX), сеть Gnosis, авто-режим
#  cp config/exchange_flows.gnosis.example.yaml config/exchange_flows.yaml
# ======================================================================

telegram:
  bot_token: ${EXCHANGE_BOT_TOKEN}
  chat_id: ${EXCHANGE_CHAT_ID}
  # thread_id: 123          # ветка супергруппы, если нужно

min_usd: 80000              # порог, $

# Авто-режим: бот читает ВСЕ ERC-20 переводы сети, оставляет те, что касаются бирж
# (и выученных депозитных адресов) — новые токены подхватываются сами, список не нужен.
auto_tokens:
  chains: [gnosis]
  # По умолчанию исключены: стейблкоины (по символу и цене ~$1), ETH/BTC/BNB/SOL и их
  # обёртки/LST (WETH, wstETH, WBTC, cbBTC, WBNB, ...), золото (PAXG, XAUT).
  exclude_symbols: []       # добавить свои, напр. [GNO, COW]
  allow_symbols: []         # вернуть исключённый по умолчанию символ
  exclude_addresses: []     # исключить токен по адресу
  min_price_confidence: 0.8 # антискам: цена DefiLlama с низкой уверенностью (тонкий пул) — игнор

# tokens:                   # (необязательно) токены, которые слушать всегда, даже если
#   - chain: gnosis         #  попадают под фильтр; можно задать индивидуальный порог
#     address: "0x..."
#     min_usd: 30000

# Депозитные адреса бирж выучиваются сами: EOA, который свипнул токены на hot-кошелёк
# биржи, запоминается навсегда (state). Следующий завод на него приходит сразу,
# с реальным отправителем; повторные свипы не шлются.
learn_deposit_addresses: true
deposit_lookback_blocks: 5000   # где искать отправителя при первом свипе (~7 ч на Gnosis)

# Выводы с бирж на фреш-кошельки (новый EOA без исходящих транзакций) — помечаются 🆕
fresh_wallets:
  enabled: true
  max_nonce: 0              # сколько исходящих tx ещё считается «фреш» (0 = ни одной)
  min_usd: 30000            # свой порог для фреш-выводов (ниже общего min_usd); пусто = как min_usd
  only: false               # true = из выводов слать ТОЛЬКО фреш-кошельки

exchanges:
  include: []               # только эти биржи, напр. [Binance, Kraken]; пусто = все
  exclude: []
  extra_addresses:          # свои hot-адреса бирж на Gnosis (дополняют базу)
    # "0x...": "Kraken"

alert_same_exchange: false
alert_exchange_to_exchange: true
track_deposit_addresses: true
deposit_memory_hours: 72

known_addresses: {}

# Свой RPC (например, eRPC с сетью gnosis) — будет основным, публичные останутся резервом
chains:
  gnosis:
    rpc_urls:
      - ${GNOSIS_RPC_URL}

state_file: state/exchange_flows.json
poll_interval: 20
