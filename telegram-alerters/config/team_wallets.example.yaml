# ======================================================================
#  Бот №1 — переводы токенов С/НА командные кошельки
#  Скопируйте в config/team_wallets.yaml и заполните.
#  Любое значение может ссылаться на переменную окружения: ${NAME}
# ======================================================================

telegram:
  bot_token: ${TEAM_BOT_TOKEN}       # токен ОТДЕЛЬНОГО бота от @BotFather
  chat_id: ${TEAM_CHAT_ID}           # id чата/канала (для групп начинается с -100)
  # thread_id: 123                   # топик в форуме (опционально)

# Токены, переводы которых отслеживаем (адреса контрактов).
tokens:
  - chain: ethereum
    address: "0x514910771af9ca656af840dff83e8264ecf986ca"   # пример: LINK — замените на свой токен
    symbol: LINK          # опционально (иначе берётся из DefiLlama / контракта)
    # decimals: 18        # опционально
    # price_usd: 1.0      # фиксированная цена (стейблкоины / токен без рынка)
    # min_usd: 1000       # порог именно для этого токена
  # - chain: bsc
  #   address: "0x..."
  # --- другие сети (раскомментируйте нужные) ---
  # - chain: tron                       # TRC-20, адрес в формате T...
  #   address: "TXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX"
  # - chain: solana                     # SPL mint (регистр важен!)
  #   address: "So11111111111111111111111111111111111111112"
  # - chain: hyperevm                   # ERC-20 на HyperEVM
  #   address: "0x..."
  # - chain: hypercore                  # спот-токен Hyperliquid L1 — указывается ИМЯ токена
  #   address: "PURR"

# ----------------------------------------------------------------------
# АВТОПОИСК командных кошельков — бот сам находит их по каждому токену:
#   деплоер контракта, получатели минта, начальное распределение (2 уровня),
#   Safe-мультисиги / vesting / timelock, крупные холдеры; биржи и DeFi-контракты
#   (пулы, роутеры, мосты) отсеиваются. Повтор раз в refresh_hours.
# + «следование за деньгами»: крупный перевод с командного кошелька на новый
#   адрес (не биржа, не DEX) — этот адрес тоже становится командным.
# Проверить результат без Telegram:
#   python -m alerters.team_wallets_bot.discover -c config/team_wallets.yaml
# ----------------------------------------------------------------------
auto_discovery:
  enabled: true
  min_score: 3              # выше => строже (меньше ложных кошельков)
  min_share_pct: 0.5        # доля supply, которая считается «крупной аллокацией»
  top_holders: 50
  max_depth: 2
  refresh_hours: 24
  notify: true              # сообщение в чат со списком найденных кошельков
  follow_outflows: true
  follow_min_usd: 50000
  follow_min_supply_pct: 0.5
  follow_max_depth: 2

# Ручной список (необязателен при автопоиске) — дополняет найденные автоматически.
wallets: []
#  - name: "Treasury"
#    address: "0x..."
#    chains: [ethereum]     # не указано => во всех сетях

# Адреса, которые автопоиск НЕ должен считать командными (инвесторы, OTC и т.п.)
exclude_wallets: []

# true => алерт на ЛЮБОЙ ERC-20, проходящий через командные кошельки (не только tokens)
track_all_tokens: false
skip_unpriced: true        # при track_all_tokens игнорировать токены без цены (спам-аирдропы)
min_usd: 0                 # 0 = любые суммы
alert_internal: true       # переводы между двумя командными кошельками

# Подписи для известных адресов в сообщениях (MM, фонды, вестинг и т.п.)
known_addresses:
  # "0xabc...": "Wintermute"

# Свои RPC (Alchemy / Infura / QuickNode / своя нода) — используются первыми,
# публичные бесплатные из config/chains.yaml остаются как резерв.
chains:
  ethereum:
    rpc_urls:
      - ${ETH_RPC_URL}
    # confirmations: 2

state_file: state/team_wallets.json
poll_interval: 20          # секунд между опросами в режиме демона
